<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>自己紹介ページ</title>
    <link rel="stylesheet" href="style.css">
    <!-- fontawesome -->
    <script src="https://kit.fontawesome.com/b68fb17dce.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="wrapper">
        <main>
            <h1>自己紹介ページ</h1>
            <section id="profile">
                <h2>profile</h2>
                <img src="img/account.png" alt="プロフィール画像">

                <p class="my-name">
                    <ruby>
                        高田 太郎
                        <rt>たかだ たろう</rt>
                    </ruby>
                </p>
                <div class="left-area">
                    <h3>生年月日</h3>
                    <p>2026/08/20</p>
                </div>
                <div class="right-area">
                    <h3>出身地</h3>
                    <p>東京都新宿区高田馬場</p>


                </div>
            </section>


            <section id="favorite">
                <h2>Favorite</h2>

                <div class="left-area">
                    <h3>好きなWebサイト</h3>
                    <p><a href="#">リンク付きテキスト</a></p>

                    <h3>好きな動物</h3>
                    <ul>
                        <li>ねこ</li>
                        <li>いぬ</li>
                        <li>とり</li>
                    </ul>
                    <iframe class="youtube" width="380" src="https://www.youtube.com/embed/Wq1G1fMgZ2k?si=uxxQPUMfM3Rbqq53" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="right-area">
                    <h3>好きな人物</h3>
                    <p>スティーブ・ジョブズ</p>
                    <img src="img/marugame.jpg">
                </div>
            </section>

            <section id="link">
                <h2>link</h2>
                <!-- Twitter -->
                <a href="#" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
                <!-- Facebook -->
                <a href="#" target="_blank" title="Facebook"><i class="fab fa-facebook-square"></i></a>
                <!-- Instagram -->
                <a href="#" target="_blank" title="Instagram"><i class="fab fa-instagram-square"></i></a>
                <!-- YouTube -->
                <a href="#" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                <!-- TikTok -->
                <a href="#" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
            </section>
        </main>
    </div><!-- wrapper -->

</body>

</html>
